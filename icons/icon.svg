<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2a3a"/>
      <stop offset="100%" style="stop-color:#071a27"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="50%" style="stop-color:#00aaff"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
  </defs>
  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Diamant -->
  <polygon points="256,40 472,256 256,472 40,256"
           fill="rgba(13,61,92,0.9)"
           stroke="url(#border)" stroke-width="12"/>
  <!-- Ligne horizontale rouge -->
  <line x1="44" y1="256" x2="468" y2="256" stroke="#ff4d6a" stroke-width="6"/>
  <!-- Ligne verticale bleue -->
  <line x1="256" y1="256" x2="256" y2="468" stroke="#00aaff" stroke-width="6"/>
  <!-- Texte PpO2 -->
  <text x="256" y="185" text-anchor="middle" font-family="system-ui,sans-serif"
        font-weight="700" font-size="58" fill="#00d4aa">PpO₂</text>
  <!-- Texte %O2 -->
  <text x="155" y="355" text-anchor="middle" font-family="system-ui,sans-serif"
        font-weight="700" font-size="48" fill="#ff9900">%O₂</text>
  <!-- Texte Pabs -->
  <text x="358" y="355" text-anchor="middle" font-family="system-ui,sans-serif"
        font-weight="700" font-size="48" fill="#00aaff">Pabs</text>
</svg>
